{{- if not .Values.secrets.existingSecret }}
{{- $name := include "llmhub.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $s := .Values.secrets }}
{{- $generated := list "BETTER_AUTH_SECRET" "USER_API_KEY_PEPPER" }}
{{- if and .Values.vllm.enabled .Values.vllm.requireApiKey }}
{{- /* The bundled vLLM needs a key; the frontend sends the same one. */}}
{{- $generated = append $generated "ALWAYS_ON_VLLM_API_KEY" }}
{{- end }}
{{- $values := dict
  "BETTER_AUTH_SECRET" $s.betterAuthSecret
  "USER_API_KEY_PEPPER" $s.userApiKeyPepper
  "CILOGON_CLIENT_ID" $s.cilogonClientId
  "CILOGON_CLIENT_SECRET" $s.cilogonClientSecret
  "ALWAYS_ON_VLLM_API_KEY" $s.alwaysOnVllmApiKey
  "OPENAI_API_KEY" $s.openaiApiKey
  "NCSA_API_KEY" $s.ncsaApiKey
  "S3_ACCESS_KEY_ID" $s.s3AccessKeyId
  "S3_SECRET_ACCESS_KEY" $s.s3SecretAccessKey
}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "llmhub.labels" . | nindent 4 }}
  annotations:
    # Keep generated secrets (notably the API-key pepper) across uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := $generated }}
  {{- if get $values $key }}
  {{ $key }}: {{ get $values $key | b64enc | quote }}
  {{- else if hasKey $existing $key }}
  {{ $key }}: {{ get $existing $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $v := $values }}
  {{- if and $v (not (has $key $generated)) }}
  {{ $key }}: {{ $v | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
