{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
{{- $name := include "llmhub.postgresql.fullname" . }}
{{- $key := .Values.postgresql.passwordKey }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "llmhub.componentLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
  annotations:
    # The data volume outlives an uninstall; so must the password that opens it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.postgresql.password }}
  {{ $key }}: {{ .Values.postgresql.password | b64enc | quote }}
  {{- else if hasKey $existing $key }}
  {{ $key }}: {{ get $existing $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llmhub.db.secretName" . }}
  labels:
    {{- include "llmhub.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.externalDatabase.passwordKey }}: {{ required "externalDatabase.password or externalDatabase.existingSecret is required" .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
