{{- if .Values.vllm.enabled }}
{{- $v := .Values.vllm }}
{{- $name := printf "%s-vllm" (include "llmhub.fullname" .) }}
{{- if $v.cache.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-hf-cache
  labels:
    {{- include "llmhub.componentLabels" (dict "ctx" . "component" "vllm") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep  # model weights are slow to re-download
spec:
  accessModes: [ReadWriteOnce]
  {{- with $v.cache.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $v.cache.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "llmhub.componentLabels" (dict "ctx" . "component" "vllm") | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http
  selector:
    {{- include "llmhub.componentSelectorLabels" (dict "ctx" . "component" "vllm") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "llmhub.componentLabels" (dict "ctx" . "component" "vllm") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate  # one GPU, one RWO cache volume
  selector:
    matchLabels:
      {{- include "llmhub.componentSelectorLabels" (dict "ctx" . "component" "vllm") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llmhub.componentSelectorLabels" (dict "ctx" . "component" "vllm") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vllm
          image: {{ include "llmhub.image" (dict "image" $v.image "ctx" .) }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args:
            - {{ $v.model | quote }}
            - --served-model-name
            - {{ $v.model | quote }}
            - --max-model-len
            - {{ $v.maxModelLen | quote }}
            - --dtype
            - {{ $v.dtype | quote }}
            - --gpu-memory-utilization
            - {{ $v.gpuMemoryUtilization | quote }}
            {{- if $v.requireApiKey }}
            - --api-key
            - $(VLLM_API_KEY)
            {{- end }}
            {{- range $v.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- if $v.requireApiKey }}
            # Same key the frontend sends as ALWAYS_ON_VLLM_API_KEY.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "llmhub.secretName" . }}
                  key: ALWAYS_ON_VLLM_API_KEY
            {{- end }}
            {{- with $v.hfTokenSecret }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: HF_TOKEN
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 120  # first start downloads weights
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          {{- with $v.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: hf-cache
          {{- if $v.cache.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-hf-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: dshm
          emptyDir:
            medium: Memory
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
