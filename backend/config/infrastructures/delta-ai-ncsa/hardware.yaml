# NCSA DeltaAI GPU partitions for the fit estimator (same schema as
# infrastructures/delta/hardware.yaml; see its header for field meanings).
#
# NOT YET VERIFIED against the cluster. Partition and GRES names come from the
# deployment kit (infra/delta/config/cluster-deltaai.env: ghx4-interactive,
# gpu:nvidia_gh200_120gb:4), which launch-tests against DeltaAI, as do the
# walltimes (ghx4-interactive: MaxTime 2h; ghx4: 2 days). Confirm the partition
# list with `sinfo -h -o "%R|%G|%l"` on dtai-svc-llmaas01.
#
# vram_gib_per_gpu: 95.0 is the 96 GB GH200 variant, padded. The GRES name says
#   120gb, so the real value may be higher; until it is measured
#   (`python -m app.services.fit_estimator.discovery --probe`, or nvidia-smi
#   memory.total on a node) the gate errs toward refusing, never accepting.
# framework_overhead_gib: Delta's vLLM 0.11 calibration. DeltaAI runs the
#   aarch64 vLLM 0.28 image and has not been probed (#106).
# su_per_gpu_hour: omitted until DeltaAI's billing rates are confirmed; the
#   survey then shows no cost.

partitions:
  - partition: ghx4
    gpus_per_node: 4
    gpu_type: NVIDIA GH200
    resource_type: nvidia_gh200_120gb
    compute_capability: 9.0
    vendor: NVIDIA
    vram_gib_per_gpu: 95.0
    framework_overhead_gib: 0.8
    tp_communication_buffer_gib: 0.25
    max_walltime: "2-00:00:00"

  - partition: ghx4-interactive
    gpus_per_node: 4
    gpu_type: NVIDIA GH200
    resource_type: nvidia_gh200_120gb
    compute_capability: 9.0
    vendor: NVIDIA
    vram_gib_per_gpu: 95.0
    framework_overhead_gib: 0.8
    tp_communication_buffer_gib: 0.25
    max_walltime: "2:00:00"
