# Illinois Campus Cluster GPU partitions for the fit estimator (same schema as
# infrastructures/delta/hardware.yaml; see its header for field meanings).
#
# NOT YET VERIFIED against the cluster. Campus Cluster partitions mix GPU types,
# so rows are keyed by partition + resource_type, and the gate sizes a launch
# only when the request names the GPU type. Partitions and GPU types come from
# this directory's environment.yaml allowed_values; which GPU types each
# partition really holds, and their exact GRES names, still need checking with
# `python -m app.services.fit_estimator.discovery` on a Campus Cluster login
# node. A row for a GPU a partition lacks cannot cause a false accept (Slurm
# rejects that request), but the fit survey would list it.
#
# vram_gib_per_gpu: published capacity padded below typical nvidia-smi values;
#   ambiguous models assume the smaller variant, so errors only ever refuse.
# compute_capability: V100 (7.0), T4 (7.5), A100 (8.0) and A40/A6000 (8.6) run
#   FP8/MXFP4 checkpoints dequantized, so the validator refuses to size them.
# gpus_per_node: omitted until verified, so the gate does not cap tensor
#   parallelism here; Slurm rejects a request larger than the node.
# su_per_gpu_hour: omitted -- Campus Cluster does not bill in SUs.

partitions:
  - partition: IllinoisComputes-GPU
    gpu_type: NVIDIA A40
    resource_type: A40
    compute_capability: 8.6
    vendor: NVIDIA
    vram_gib_per_gpu: 44.988  # measured on Delta
    framework_overhead_gib: 0.8
    tp_communication_buffer_gib: 0.25

  - partition: IllinoisComputes-GPU
    gpu_type: NVIDIA A100
    resource_type: A100
    compute_capability: 8.0
    vendor: NVIDIA
    vram_gib_per_gpu: 40.0  # assumes the 40GB variant; 80GB nodes exist
    framework_overhead_gib: 0.8
    tp_communication_buffer_gib: 0.25

  - partition: IllinoisComputes-GPU
    gpu_type: NVIDIA H100
    resource_type: H100
    compute_capability: 9.0
    vendor: NVIDIA
    vram_gib_per_gpu: 79.0  # 80GB, typical smi ~79.6 GiB, padded
    framework_overhead_gib: 0.8
    tp_communication_buffer_gib: 0.25

  - partition: IllinoisComputes-GPU
    gpu_type: NVIDIA V100
    resource_type: V100
    compute_capability: 7.0
    vendor: NVIDIA
    vram_gib_per_gpu: 15.7  # assumes the 16GB variant; 32GB nodes exist
    framework_overhead_gib: 0.8
    tp_communication_buffer_gib: 0.25

  - partition: IllinoisComputes-GPU
    gpu_type: NVIDIA T4
    resource_type: TeslaT4
    compute_capability: 7.5
    vendor: NVIDIA
    vram_gib_per_gpu: 14.5  # 16GB, typical smi ~15 GiB, padded
    framework_overhead_gib: 0.8
    tp_communication_buffer_gib: 0.25

  - partition: IllinoisComputes-GPU
    gpu_type: NVIDIA RTX A6000
    resource_type: RTXA6000
    compute_capability: 8.6
    vendor: NVIDIA
    vram_gib_per_gpu: 47.5  # 48GB, typical smi ~48 GiB, padded
    framework_overhead_gib: 0.8
    tp_communication_buffer_gib: 0.25

  - partition: IllinoisComputes-GPU
