{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if config.extra.draft %}
  <meta name="robots" content="noindex, nofollow">
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;0,800;1,500&family=Source+Sans+3:ital,wght@0,400..700;1,400..700&family=Roboto+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
{% endblock %}

{% block announce %}
  {% if config.extra.draft %}
  <strong>Draft for review.</strong> This preview of the LLMHub docs isn't final.
  Comments go on <a href="https://github.com/Center-for-AI-Innovation/LLMHub/pull/130">pull request #130</a>.
  {% endif %}
{% endblock %}
