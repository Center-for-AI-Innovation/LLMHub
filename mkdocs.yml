site_name: LLMHub
site_description: >-
  LLMHub helps researchers and developers run open source language models on
  supercomputing clusters — discover, launch, chat with, and share model
  deployments, plus OpenAI-compatible API access.
site_url: https://center-for-ai-innovation.github.io/LLMHub/
repo_url: https://github.com/Center-for-AI-Innovation/LLMHub
repo_name: Center-for-AI-Innovation/LLMHub

theme:
  name: material
  custom_dir: overrides
  # Material's own Google Fonts loading is off; overrides/main.html loads
  # Montserrat and Source Sans 3, which stylesheets/extra.css applies.
  font: false
  logo: assets/logo_illinois.png
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

validation:
  anchors: warn

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/brand.js

plugins:
  - search
  - blog:
      blog_dir: blog
      blog_toc: true
      post_url_format: "{date}/{slug}"
      draft_if_future_date: true
      categories_allowed:
        - Releases
        - Announcements

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Center-for-AI-Innovation/LLMHub
    - icon: material/web
      link: https://center-for-ai-innovation.github.io/LLMHub/

nav:
  - Introduction: index.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
      - Using chat: getting-started/using-chat.md
      - Model library: getting-started/model-library.md
      - FAQs: getting-started/faqs.md
  - Deploying Models:
      - deploying/index.md
      - Launching a model: deploying/launching.md
      - GPUs & cost: deploying/gpu-resources.md
      - Logs & monitoring: deploying/logs-monitoring.md
      - Sharing & access: deploying/sharing-access.md
      - Requesting new models: deploying/requesting-models.md
  - API Reference:
      - api/index.md
      - Authentication: api/authentication.md
      - Chat completions: api/chat-completions.md
  - Self-Hosting:
      - self-hosting/index.md
      - Local development: self-hosting/local-development.md
      - Delta & DeltaAI: self-hosting/delta.md
      - Magic Castle (Radiant): self-hosting/magic-castle.md
      - Configuration reference: self-hosting/configuration.md
  - How It Works:
      - how-it-works/index.md
      - Architecture: how-it-works/architecture.md
      - Glossary: how-it-works/glossary.md
  - Contributing:
      - Development setup: contributing/dev-setup.md
      - Repository layout: contributing/repository-layout.md
      - Testing & CI: contributing/testing-ci.md
  - Blog: blog/index.md
